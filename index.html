<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Bộ Lạc.io</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: #2b2b2b; /* Darker background, will draw grid over it */
      overflow: hidden;
      touch-action: none;
      font-family: 'Be Vietnam Pro', sans-serif;
    }
    #app {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      position: absolute;
      top: 0;
      left: 0;
      overflow: hidden;
    }
    canvas {
      display: block;
    }
  </style>
  <link rel="stylesheet" href="/papa-splash.css" />
</head>
<body>
  <div id="papa-studio-splash" role="status" aria-label="PapaStudio">
    <img class="papa-studio-splash-logo" src="/assest/Logo/PapaStudio_Logo_Full_Color.png.png" alt="PapaStudio" />
    <div class="papa-studio-progress-track" aria-hidden="true"><div class="papa-studio-progress-fill"></div></div>
  </div>
  <div id="app"></div>
  <script src="https://sdk.winkgames.fun/v1/wink.js"></script>
  <script src="/papa-splash.js"></script>
    <script type="module" src="/src/main.js"></script>
</body>
</html>
